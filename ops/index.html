<title>Yuzen Ops</title>

<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Yuzen Ops">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>document.documentElement.classList.add("ops")</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a quiet app shell around one idea, a card table. Visuals follow the references: navy, purple and gold
   with white-framed jewel cards (Midnight), teal glass panels (Lagoon), and a plain light option (Workshop).
   Skins change the table and every card face. Groups stack vertically; groups run left to right as the flow. */
:root{
  --bg:#EEF0F7; --surface:#FBFBFE; --surface2:#F1F2F9; --ink:#14173A; --muted:#575C82; --line:#D5D8EA;
  --accent:#5A2DC0; --accent-ink:#FFFFFF; --accent-soft:#E6DEF8;
  --gold:#E9AE3C; --amber:#8A5A00; --amber-soft:#F7E9C8; --bad:#A33A2A; --good:#1E6B4B;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,23,58,.08),0 8px 24px rgba(20,23,58,.08);
  --focus:#5A2DC0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1230; --surface:#161B42; --surface2:#1D234F; --ink:#EEF0FF; --muted:#A3A9D6; --line:#2B3263;
  --accent:#A98BFF; --accent-ink:#120B2E; --accent-soft:#2A2158;
  --gold:#F2C15A; --amber:#F2C15A; --amber-soft:#3A2D12; --bad:#FF9A86; --good:#6CCB9A;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.4); --focus:#A98BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1230; --surface:#161B42; --surface2:#1D234F; --ink:#EEF0FF; --muted:#A3A9D6; --line:#2B3263;
  --accent:#A98BFF; --accent-ink:#120B2E; --accent-soft:#2A2158;
  --gold:#F2C15A; --amber:#F2C15A; --amber-soft:#3A2D12; --bad:#FF9A86; --good:#6CCB9A;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.4); --focus:#A98BFF; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;letter-spacing:-.01em}

/* header */
.top{background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.bar-in{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;max-width:1360px;margin:0 auto}
.bar-ctl{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-left:auto;padding:4px 0}
.bar-ctl .ctl{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar-ctl .ctl[hidden]{display:none}
.bar-ctl .seg button{padding:3px 11px;font-size:12.5px;letter-spacing:0;text-transform:none}
.bar-top .tabs{margin:0;flex:1 1 auto;min-width:0}
.bar-top .tab{padding:9px 14px 8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .hx{width:34px;height:38px;flex:none;background:#EDB75A;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center}
.brand .hx i{width:28px;height:32px;background:linear-gradient(150deg,#6A21C9,#9B30E6);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;color:#F2C46A;font:800 16px var(--font-display);font-style:normal}
.brand div{display:flex;flex-direction:column;line-height:1.1}
.brand b{font:700 21px var(--font-display);letter-spacing:-.02em}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.tabs{display:flex;gap:4px;max-width:1360px;margin:8px auto 0;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

main{max-width:1360px;margin:0 auto;padding-top:28px}
.view-head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.view-head h2{font-size:30px}
.view-head p{color:var(--muted);max-width:64ch;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.def-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 8px;padding:10px 12px;border:1px solid var(--line,var(--border,rgba(128,128,128,.3)));border-radius:10px;background:var(--surface2)}.def-bar .grow{min-width:160px;flex:1}.def-bar b{display:block;font-size:13px}.def-bar small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.btn.ghost{background:transparent}
.sel,.txt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}

/* ───── phone viewport: ONE size for every preview (popup, library drawers, profile walkthrough).
   Change it here only. Height is the token; width follows the ratio. ───── */
:root{--ph-h:724px;--ph-ratio:.4751;--ph-z:1}
.pm-wrap .phone{zoom:var(--ph-z)}

/* ───── skins: variables for every card face and the table ───── */
[data-skin]{
  --t-bg:radial-gradient(ellipse at 50% -10%,#13204D 0,transparent 62%),radial-gradient(circle at 92% 104%,#1A1250 0,transparent 46%),#060920;
  --proj:#5CE1FF;--t-rim:transparent;--t-text:#E9F6FF;--t-muted:#8EB3D6;--t-slot:rgba(92,225,255,.05);--t-slot-line:rgba(92,225,255,.45);--t-hi:#5CE1FF;
  --cf-frame:#FFFFFF;--cf-ink:#1B1F4B;--cf-sub:#5A5F8E;--cf-line:#E4E6F4;--cf-shadow:0 3px 8px rgba(5,8,30,.45);--cf-blur:none;--cf-chip:#F1F2FA;
}
[data-skin="lagoon"]{
  --t-bg:linear-gradient(180deg,#58D2DC 0%,#2FA58E 55%,#247F63 100%);
  --proj:#FFFFFF;--t-rim:transparent;--t-text:#FFFFFF;--t-muted:#DDF5EE;--t-slot:rgba(255,255,255,.14);--t-slot-line:rgba(255,255,255,.6);--t-hi:#FFE08A;
  --cf-frame:rgba(255,255,255,.2);--cf-ink:#FFFFFF;--cf-sub:#E6F8F2;--cf-line:rgba(255,255,255,.28);--cf-shadow:0 6px 18px rgba(8,70,56,.3);--cf-blur:blur(10px);--cf-chip:rgba(255,255,255,.2);
}
[data-skin="workshop"]{
  --t-bg:#DAD7CE;--proj:#5A2DC0;--t-rim:transparent;--t-text:#262A27;--t-muted:#5B605B;--t-slot:rgba(0,0,0,.04);--t-slot-line:rgba(0,0,0,.28);--t-hi:#5A2DC0;
  --cf-frame:#FFFFFF;--cf-ink:#1B1F1D;--cf-sub:#5F645F;--cf-line:#E4E1D8;--cf-shadow:0 1px 2px rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.1);--cf-blur:none;--cf-chip:#F1EFE8;
}

/* ───── card face (library, table, hand) ───── */
.cf{--cw:188px;position:relative;width:var(--cw);flex:none;background:var(--cf-frame);color:var(--cf-ink);border-radius:16px;padding:5px;box-shadow:var(--cf-shadow);
  -webkit-backdrop-filter:var(--cf-blur);backdrop-filter:var(--cf-blur);border:1px solid var(--cf-line);display:flex;flex-direction:column;text-align:left}
.cf-top{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 4px;min-width:0}
.cf-rank{font:800 17px var(--font-display);min-width:30px;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cf-nm{font:700 14.5px var(--font-display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf-suit{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--cf-frame)}
.cf-art{position:relative;height:112px;flex:none;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cf-art::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.3) 0,rgba(255,255,255,0) 42%);pointer-events:none}
.cf-art img{max-width:78%;max-height:84%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));position:relative;z-index:1;pointer-events:none}
.cf-art.cover img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover;filter:none}
.cf-info{display:flex;flex-direction:column;gap:7px;padding:9px 6px 5px;font-size:12px;min-height:0}
.cf-row{display:flex;align-items:center;gap:6px;min-width:0}
.cf-row .k{width:44px;flex:none;color:var(--cf-sub);font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.cf-row .v{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf-row .v span{overflow:hidden;text-overflow:ellipsis}
.rdot{width:10px;height:10px;border-radius:50%;flex:none;display:block}
.kdots{display:inline-flex;gap:3px;flex:none}
.kdots b{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--cf-sub);display:block}
.kdots b.on{background:var(--t-hi);border-color:var(--t-hi)}
[data-skin="workshop"] .kdots b.on{background:#5A2DC0;border-color:#5A2DC0}
.kdots.p b.on{background:#7DDBA3;border-color:#7DDBA3}
.todo-t{font-style:italic;color:var(--cf-sub);font-weight:500}
.scn{display:inline-flex;align-items:center;gap:4px;background:var(--cf-chip);border-radius:99px;padding:1px 8px 1px 5px;font-size:11.5px;font-weight:600;white-space:nowrap}
.scn i{width:9px;height:9px;border-radius:50%;background:#B9C9F5;border:1px solid rgba(20,23,58,.3);display:block}
.cf-people{display:none;height:112px;flex:none;border-radius:11px;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:var(--cf-chip)}
.cf-people .av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 18px var(--font-display);color:#fff}
.cf-people .pr{font-size:12.5px;font-weight:700;text-align:center;padding:0 8px}
[data-lens="people"] .cf-art{display:none}
[data-lens="people"] .cf-people{display:flex}

/* library */
.lib-top{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-bottom:30px;padding:28px;border-radius:24px;background:var(--t-bg);color:var(--t-text);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.back{position:relative;width:148px;height:208px;flex:none;border-radius:18px;background:linear-gradient(145deg,#5E1FB8,#9B30E6 60%,#5517A8);border:6px solid #EDB75A;box-shadow:0 8px 20px rgba(0,0,0,.4),4px 4px 0 -1px #B97A22,9px 9px 0 -2px #7A4FC0}
.back::before{content:"";position:absolute;inset:9px;border:2px solid rgba(237,183,90,.65);border-radius:9px}
.back .hx{position:absolute;inset:0;margin:auto;width:78px;height:88px;background:#EDB75A;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center}
.back .hx i{width:66px;height:75px;background:linear-gradient(150deg,#6A21C9,#8E2BD8);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;color:#F2C46A;font:800 21px var(--font-display);letter-spacing:-.05em;font-style:normal}
.back .ct{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#F2C46A;font:700 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase}
.lib-note{max-width:62ch;position:relative}
.lib-note h2{font-size:32px;margin-bottom:6px}
.lib-note p{color:var(--t-muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--t-muted);align-items:center}
.legend .kdots b{border-color:var(--t-muted)}
.legend .kdots.p b.on{background:#7DDBA3;border-color:#7DDBA3}
.coinx{position:absolute;border-radius:50%;pointer-events:none}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#FFE9A8,#EBAF3A 58%,#A8680F);border:2px solid #F8D47C;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.chipg{display:inline-block;width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle,#1F7A4A 0 38%,#14653B 39% 100%);border:3px dashed #D9F3E4;box-shadow:0 0 0 2px #14653B}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:4px 14px 4px 5px;font-size:14px;color:var(--t-text);font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill b{font-family:var(--font-display);font-size:17px}
[data-skin="workshop"] .pill{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:26px 22px;justify-items:center}
.lcard{--cw:100%;max-width:262px;width:100%;transition:transform .15s ease;padding:5px;cursor:pointer;font:inherit}
.lcard:hover{transform:translateY(-5px) rotate(-.6deg)}
.lcard .cf-art{height:168px}
.lcard .cf-sum{font-size:13px;line-height:1.4;color:var(--cf-sub);padding:8px 6px 0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;min-height:calc(2.8em + 8px)}
.lcard .cf-info{padding-top:6px}
.lgrid-wrap{padding:26px 22px;border-radius:24px;background:var(--t-bg);box-shadow:var(--shadow)}
.dots{display:inline-flex;gap:4px}
.dots b{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.dots b.on{background:var(--accent);border-color:var(--accent)}
.arrow{color:var(--muted);font-size:13px}

/* drawer */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px 2px 8px;font-size:12.5px;font-weight:500;color:var(--ink)}
.chip i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(20,23,58,.25);display:block}
.scrim{position:fixed;inset:0;background:rgba(8,10,30,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--surface);z-index:50;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.3);
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) 24px;display:flex;flex-direction:column;gap:22px}
.d-head{display:flex;gap:16px;align-items:flex-start}
.d-art{width:96px;height:96px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;position:relative}
.d-art img{max-width:80%;max-height:80%;object-fit:contain}
.d-art.cover img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover}
.d-head h2{font-size:28px}
.d-head p{color:var(--muted);margin-top:4px}
.d-x{margin-left:auto;border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;flex:none}
.d-sec{display:flex;flex-direction:column;gap:10px}
.d-sec>h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--font-body);font-weight:600}
.part{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.part header{display:flex;align-items:center;gap:8px}
.part header b{font:600 16px var(--font-display)}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--good);border-color:var(--good)}
.tag.todo{color:var(--amber);border-color:var(--amber)}
.part p{font-size:14px}
.part .tbd{color:var(--muted);font-style:italic}
.shots{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.shots img{border:1px solid var(--line);border-radius:14px;background:#fff;display:block}
.shots img.phone{width:176px}
.shots img.row{width:100%;max-width:420px;border-radius:10px}
.knob{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.knob:last-child{border-bottom:0}
.knob span.l{flex:1;min-width:0}
.knob .s{font-size:12px;color:var(--muted)}
.switch{width:40px;height:24px;border-radius:99px;border:1.5px solid var(--muted);background:var(--surface);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--accent-ink)}
.switch[disabled]{opacity:.55;cursor:not-allowed}
.code{position:relative;background:#101437;color:#E6E9FF;border-radius:12px;padding:16px;font:13px/1.6 var(--font-mono);overflow-x:auto;white-space:pre}
.code .cp{position:absolute;top:8px;right:8px;background:#232A63;color:#E6E9FF;border:1px solid #3A4290;border-radius:8px;padding:3px 10px;font:500 12px var(--font-body)}
.empty-note{border:1.5px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted)}

/* ───── table ───── */
.rim{background:var(--t-rim);border-radius:30px;padding:7px}
.felt{background:var(--t-bg);border-radius:24px;position:relative;overflow:hidden;color:var(--t-text)}
[data-skin="blueprint"] .felt{background-size:28px 28px}
.felt-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 22px 18px;border-top:1px solid color-mix(in srgb,var(--proj,#fff) 18%,transparent)}
.felt-top .sp{flex:1}
.felt-top .tip{font-size:13px;color:var(--t-muted)}
.lane{display:flex;align-items:flex-start;padding:22px 24px 40px;overflow-x:auto;min-height:400px;scrollbar-color:var(--t-muted) transparent}
.gap{flex:none;width:58px;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:150px;color:var(--t-hi);font-size:30px;line-height:1;transition:width .12s,background .12s;border-radius:16px}
.gap::before{content:"";width:2px;height:46px;background:linear-gradient(var(--t-hi),transparent);opacity:.0}
.gap.over{width:100px;background:var(--t-slot);outline:2px dashed var(--t-hi);outline-offset:-4px}
.group{flex:none;display:flex;flex-direction:column;gap:10px;width:188px;border-radius:16px}
.group.over{outline:2px dashed var(--t-hi);outline-offset:8px}
.ghead{display:flex;flex-direction:column;gap:2px;min-width:0}
.gstep{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t-hi);font-weight:700}
.gtitle{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--t-slot-line);color:var(--t-text);font:700 17px var(--font-display);padding:2px 0 5px;text-align:left}
.gtitle::placeholder{color:var(--t-muted);font-weight:500}
.gtitle:focus{outline:none;border-bottom-color:var(--t-hi)}
.gmeta{font-size:12px;color:var(--t-muted);padding-top:2px}
.stack{position:relative;width:188px;height:var(--h,calc(206px + (var(--n) - 1) * 42px))}
.tcard{position:absolute;left:0;top:var(--top,calc(var(--i) * 42px));z-index:calc(var(--i) + 1);height:206px;cursor:grab;transition:transform .12s}
.tcard:active{cursor:grabbing}
.tcard.sel{outline:3px solid var(--t-hi);outline-offset:2px;z-index:60;transform:translateY(-7px)}
.endslot{flex:none;width:188px;height:206px;margin-top:70px;border:2px dashed var(--t-slot-line);border-radius:16px;background:var(--t-slot);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:var(--t-muted);font-size:13.5px}
.endslot.over{border-color:var(--t-hi);color:var(--t-hi)}
.drop-tray{position:absolute;right:16px;top:8px;display:none;gap:10px;align-items:center;z-index:5}
.dragging .tip{visibility:hidden}
.dragging .drop-tray{display:flex}
.drop-act{display:flex;flex-direction:row;align-items:center;gap:8px;color:#fff;font:700 12px var(--font-body);letter-spacing:.04em;animation:dropin .22s cubic-bezier(.3,1.4,.5,1) both}
.drop-act .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border:2px dashed rgba(255,255,255,.6);transition:transform .15s ease,background .15s ease,border-color .15s ease}
.drop-act .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.drop-act.over .ic{background:var(--bad);border-style:solid;border-color:#fff;transform:scale(1.18)}
.drop-act .lb{pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
@keyframes dropin{from{opacity:0;transform:translateY(12px) scale(.7)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.drop-act{animation:none}}
.people-key{display:none;gap:14px;flex-wrap:wrap;padding:10px 22px 14px;color:var(--t-text);font-size:13px;border-top:1px solid var(--t-slot-line)}
[data-lens="people"] .people-key{display:flex}
.people-key span{display:inline-flex;align-items:center;gap:6px}

/* builder + yc */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1;min-width:0}
.bar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.hand{display:flex;gap:12px;overflow-x:auto;padding:6px 4px 16px;margin-bottom:6px;align-items:flex-start}
.hand .back{width:96px;height:134px;border-width:4px;box-shadow:0 5px 12px rgba(0,0,0,.3),3px 3px 0 -1px #B97A22}
.hand .back .hx{width:50px;height:57px}.hand .back .hx i{width:42px;height:48px;font-size:13px}
.hand .back::before{inset:6px}
.hand .back .ct{bottom:7px;font-size:10px}
.mini{--cw:118px;cursor:grab;padding:4px;border-radius:13px}
.mini .cf-top{height:26px;gap:4px;padding:0 4px 0 2px}
.mini .cf-rank{font-size:13px;min-width:20px}
.mini .cf-nm{font-size:12px}
.mini .cf-art{height:62px;border-radius:9px}
.mini .mb{margin:6px 3px 3px;border:1px solid var(--cf-line);background:var(--cf-chip);color:var(--cf-ink);border-radius:8px;font-size:12px;font-weight:700;padding:3px 0;text-align:center;width:calc(100% - 6px)}
.mini .mb:hover{outline:2px solid var(--t-hi)}
/* deck: cards overlap in a fan, hover lifts one to show it whole, the face-down card folds the fan into a pile */
.hand{padding:34px 8px 16px 6px;gap:0;overflow-x:auto;overflow-y:hidden;position:relative;isolation:isolate;z-index:0}
.hand .back{border:4px solid #EDB75A;padding:0;font:inherit;cursor:pointer;z-index:40;margin-right:0}
.hand .back:focus-visible{outline:3px solid var(--t-hi,#fff);outline-offset:3px}
.hand .mini{margin-left:-62px;position:relative;z-index:1;transition:margin-left .38s cubic-bezier(.3,.8,.3,1) calc(var(--i,0)*22ms),transform .2s ease,opacity .25s ease calc(var(--i,0)*22ms),box-shadow .2s ease}
.hand .back+.mini{margin-left:26px}
.hand .mini.near{box-shadow:0 10px 22px rgba(0,0,0,.38)}
.hand.gliding .mini{transition:margin-left .14s ease-out,box-shadow .2s ease;transition-delay:0s}
.hand.collapsed .mini{margin-left:-122px;opacity:0;pointer-events:none;transform:none;transition-delay:calc((var(--n,10) - var(--i,0))*14ms)}
.hand.collapsed .back+.mini{margin-left:-122px}
.mi{width:22px;height:22px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font:800 13px/1 var(--font-display);box-shadow:0 0 0 2px var(--cf-frame)}
.hand .mini .cf-top{height:28px}
@media (prefers-reduced-motion:reduce){.hand .mini{transition:none}}

.insp{position:relative;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:20px}
.insp h3{font-size:18px}
.insp .hint{color:var(--muted);grid-column:1/-1}
.insp fieldset{border:0;padding:0;margin:0;min-width:0}
.insp legend{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0;margin-bottom:6px}
.acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.acts .row{display:flex;gap:8px}
.acts .row .btn{flex:1}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.yc-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.yc-list{display:flex;flex-direction:column;gap:10px}
.yc-item{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.yc-item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.yc-item b{font:600 18px var(--font-display)}
.yc-item span{font-size:13px;color:var(--muted)}
.savestate{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

.pm-side{width:290px;color:#fff;display:flex;flex-direction:column;gap:14px;flex:none}

/* ───── phone controls panel + leave confirmation ───── */

.pm-ctlb{border-radius:0;background:none;padding:2px 14px 12px}

.pm-confirm{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(4,6,24,.6);padding:16px}
.pm-cfb{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px 22px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px}

.pm-cfb p{margin:0;color:var(--muted);font-size:14px}

.pm-cfa{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* controls panel: calm layout, no jumping */
.pm-side{align-self:flex-start;margin-top:clamp(16px,7vh,64px);width:340px}
.pm-crow .sel{max-width:130px}
.pm-ctlh{white-space:nowrap}

.pm-ctlh em:empty{display:none}
.pm-crow{min-height:34px}

.pk-all:hover:not([disabled]){background:#FFCB5C}

.hs{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}

.scr{min-width:0}.ck-sheet,.hs{min-width:0;max-width:100%}

/* ───── reordering ───── */
.tcard{transition:top .17s cubic-bezier(.3,.8,.3,1),transform .12s}
.stack{transition:height .17s ease}
.tcard.src{opacity:0}
.stack-ph{position:absolute;left:0;width:188px;height:206px;border:2px dashed var(--proj);border-radius:16px;background:color-mix(in srgb,var(--proj) 9%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--proj) 35%,transparent),inset 0 0 18px color-mix(in srgb,var(--proj) 14%,transparent);z-index:0;pointer-events:none;transition:top .15s cubic-bezier(.3,.8,.3,1)}
.table .group.dup .stack::before{border-color:#FF4D5E;background:rgba(255,77,94,.1);box-shadow:0 0 0 4px rgba(255,77,94,.18),0 0 34px rgba(255,77,94,.6),inset 0 0 22px rgba(255,77,94,.25);animation:dupglow .7s ease-in-out infinite alternate}
.table .group.dup{outline:0}
.table .tcard.conflict{box-shadow:0 0 0 3px #FF4D5E,0 0 28px 4px rgba(255,77,94,.8)!important;animation:dupglow .7s ease-in-out infinite alternate}
@keyframes dupglow{from{filter:none}to{filter:drop-shadow(0 0 8px rgba(255,77,94,.7))}}
@media (prefers-reduced-motion:reduce){.tcard,.stack,.stack-ph{transition:none}.table .group.dup .stack::before,.table .tcard.conflict{animation:none}}

/* ───── selected-card panel: reference card + controls, updated on request ───── */
.insp{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.insp-ref{display:flex;gap:18px;align-items:flex-start;min-width:0}

.knob.chg .l::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#E9AE3C;margin-right:7px;vertical-align:1px}
.insp-upd{display:flex;gap:8px;align-items:center;margin-top:10px}
.insp .pk-all{color:#241800!important;height:40px}
.insp .pk-all[disabled]{background:var(--surface2);color:var(--muted)!important}
.insp .pk-dis{color:var(--ink)!important;border-color:var(--line);height:40px}
.tcard .cf-row .k{width:70px;font-size:10.5px}

/* ───── Essentials cards: a dashed inner stroke and a cool tint. No outer ring, so they never read as selected ───── */
.cf.ess::after{content:"";position:absolute;inset:2px;border:1.5px dashed #9AA3E8;border-radius:14px;pointer-events:none;z-index:3}
.cf.ess.mini::after{inset:1px;border-radius:12px}

.hand .mini.sep{margin-left:-40px}
.hand.collapsed .mini.sep{margin-left:-122px}
.hand .mini.sep::before{content:"";position:absolute;left:-13px;top:8px;bottom:8px;width:2px;border-radius:2px;background:rgba(120,126,170,.45)}
.hand.collapsed .mini.sep::before{display:none}

/* group header: step number and title share one line */
.ghead{flex-direction:row;align-items:center;gap:9px}
.table .gstep{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid color-mix(in srgb,var(--proj) 70%,transparent);background:color-mix(in srgb,var(--proj) 10%,transparent);color:var(--proj);font:800 13px/1 var(--font-display);letter-spacing:0;text-shadow:0 0 10px color-mix(in srgb,var(--proj) 80%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--proj) 25%,transparent);text-transform:none}
.table .gstep.dm{border-style:dashed;color:var(--t-muted);text-shadow:none;box-shadow:none;background:none;border-color:color-mix(in srgb,var(--proj) 40%,transparent)}

.table .gtitle{flex:1;min-width:0}
.gap{padding-top:134px}
.endslot{margin-top:52px}
.lcard .cf-ctl{padding:0 10px 10px;margin-top:auto;align-items:center}

.lcard{--t-hi:#3F57E0}
.lcard .cf-ctl{padding-left:6px}

.ck-types{overflow-x:auto;scrollbar-width:none}

.ctl-sep{height:1px;background:var(--line);margin:6px 0}

/* empty chip spots appear only while a chip is being moved */
.chipslot:not(.on){opacity:0;transition:opacity .18s ease,border-color .15s,box-shadow .15s,background .15s}
.dragging-chip .chipslot:not(.on){opacity:1}

/* ───── drafts bar ───── */
.drafts-bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin:6px 0 14px}
.drafts-bar h2{font-size:26px;margin:0}
.drafts-bar .sp{flex:1}

.dsel .chv{font-size:15px;line-height:1}
.dmenu{position:absolute;right:0;top:calc(100% + 8px);min-width:270px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 40px rgba(10,12,40,.28);z-index:30;display:flex;flex-direction:column}

.chipdock{gap:3px}
.chipslot{width:27px;height:27px}

/* collapsible group of checklist types inside Controls */
.ctl-grp{border-bottom:1px solid var(--line)}

.ctl-grp-h .chv{flex:none;transition:transform .2s;color:var(--muted)}
.ctl-grp.open .ctl-grp-h .chv{transform:rotate(180deg)}
.ctl-grp-h.chg small::after{content:" •";color:#E9AE3C}

.ck-from{display:inline-block;margin-left:4px;font:700 10.5px var(--font-body);letter-spacing:.03em;background:#EEF0FB;color:#4A52A8;border-radius:99px;padding:1px 7px;vertical-align:1px}

.drafts-bar .dname{flex:none;min-width:240px;max-width:100%;background:transparent;border:1px solid transparent;border-radius:10px;padding:4px 8px;margin-left:-8px;font:600 26px var(--font-display);letter-spacing:-.01em;color:var(--ink);text-overflow:ellipsis}
.drafts-bar .dname:hover{border-color:var(--line)}
.drafts-bar .dname:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.drafts-bar .dname::placeholder{color:var(--muted);font-weight:500}

/* ───── YC flows: City > Cluster > YC ───── */
.yc-top{display:flex;flex-direction:column;gap:12px;margin:6px 0 16px}

.yc-steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.ys-step.open,.ys-step:hover{border-color:var(--accent)}
.ys-step .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font:800 13px var(--font-display);font-style:normal;flex:none}
.ys-step .t{display:flex;flex-direction:column;flex:1;min-width:0}.ys-step small{font:700 10.5px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.ys-step b{font:600 16px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ys-menu{position:absolute;left:0;top:calc(100% + 8px);min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 40px rgba(10,12,40,.28);z-index:30;display:flex;flex-direction:column}
.ys-i{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:9px 10px;text-align:left;color:var(--ink)}
.ys-i:hover{background:var(--surface2)}.ys-i.on{background:var(--surface2)}
.ys-n{flex:1;display:flex;flex-direction:column;min-width:0}.ys-n b{font:600 15px var(--font-body)}.ys-n small{font-size:12px;color:var(--muted)}
.ys-b{font:700 11px var(--font-body);border-radius:99px;padding:3px 9px;white-space:nowrap}
.ys-b.ok{background:rgba(31,157,107,.16);color:#1F9D6B}.ys-b.warn{background:rgba(233,174,60,.2);color:#B8780A}
.yc-tabs{display:flex;gap:6px;flex-wrap:wrap}
.yc-tab{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 13px;color:var(--ink);font:500 13.5px var(--font-body)}
.yc-tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block}.dt.ok{background:#1F9D6B}.dt.warn{background:#E9AE3C}
.yc-state{font:700 12.5px var(--font-body);border-radius:99px;padding:5px 12px}
.yc-state.ok{background:rgba(31,157,107,.16);color:#1F9D6B}.yc-state.warn{background:rgba(233,174,60,.22);color:#B8780A}
/* table: highlight what differs from the default */
.diff-ok{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,#3DDC97 55%,transparent);color:#3DDC97;border-radius:99px;padding:6px 14px;font:700 13px var(--font-body)}
.diff-btn{display:inline-flex;align-items:center;gap:9px;background:color-mix(in srgb,#FFC247 9%,transparent);border:1.5px solid color-mix(in srgb,#FFC247 70%,transparent);color:#FFD27A;border-radius:99px;padding:6px 14px;font:700 13px var(--font-body)}
.diff-btn .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.diff-btn b{background:#FFC247;color:#2A1E00;border-radius:99px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}
.diff-btn[aria-pressed="true"]{background:#FFC247;color:#2A1E00}.diff-btn[aria-pressed="true"] b{background:#2A1E00;color:#FFC247}
.df-leg{display:inline-flex;align-items:center;gap:8px;color:var(--t-muted);font:600 12px var(--font-body);flex-wrap:wrap}
.df-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}.df-leg i.a{background:#3DDC97}.df-leg i.c{background:#FFC247}.df-leg i.m{background:#B38BFF}.df-leg i.p{background:#5CE1FF}
.df-rm{color:#FF8A95}
.table .tcard.df-added{box-shadow:0 0 0 2px #3DDC97,0 0 26px rgba(61,220,151,.7)!important}
.table .tcard.df-changed{box-shadow:0 0 0 2px #FFC247,0 0 26px rgba(255,194,71,.65)!important}

.tcard[data-df]::before{content:attr(data-df);position:absolute;right:8px;top:-9px;z-index:8;font:800 9.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:2px 8px;color:#06231A;background:#3DDC97}
.tcard[data-df=changed]::before{background:#FFC247;color:#2A1E00}.tcard[data-df=moved]::before{background:#B38BFF;color:#1B0C40}
.table .group.df-chips .chipdock{box-shadow:0 0 0 2px #5CE1FF,0 0 18px rgba(92,225,255,.6);border-radius:99px}
@media (max-width:760px){.ys-step{min-width:0;flex:1}.ys-menu{min-width:260px}}

.yc-state.edit{background:rgba(92,120,255,.18);color:#5C78FF}
.yc-bar .yc-upd{height:38px;padding:0 18px;color:#241800!important}
.yc-bar .yc-upd[disabled]{background:var(--surface2);color:var(--muted)!important}

/* Essentials on the table: clear plastic. Low visual weight so the work cards lead */
.table .tcard.ess{--cf-frame:rgba(255,255,255,.05);--cf-ink:rgba(255,255,255,.82);--cf-sub:rgba(255,255,255,.52);--cf-line:rgba(255,255,255,.22);--cf-chip:rgba(255,255,255,.08);--cf-blur:blur(14px) saturate(1.15);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 55%,rgba(255,255,255,.09));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px rgba(0,0,0,.22)}

.gnext{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--t-muted,var(--muted));font-weight:600}

.cf-nmw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.15}

.cf-subh{font:600 10.5px var(--font-body);color:var(--cf-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}

.yc-tabs{align-items:center}

var STEP=42,GAPX=14,CARDH=206;
function clearGroupFx(g){
  g.classList.remove('dup');delete g.dataset.ins;

  st.style.height='';var ph=st.querySelector('.stack-ph');if(ph)ph.remove();

function groupHover(g,e){
  var st=g.querySelector('.stack');if(!st)return true;
  var mod=S.drag.mod,others=[].filter.call(st.querySelectorAll('.tcard'),function(c){return !c.classList.contains('src')});
  var dup=others.filter(function(c){return c.dataset.mod===mod})[0];
  if(dup){clearGroupFx(g);g.classList.add('dup');dup.classList.add('conflict');return false}
  g.classList.remove('dup');
  var n=others.length,y=e.clientY-st.getBoundingClientRect().top,ins=Math.max(0,Math.min(n,Math.round((y-STEP/2)/STEP)));
  g.dataset.ins=ins;
  others.forEach(function(c,j){c.style.top=(j*STEP+(j>=ins?STEP+GAPX:0))+'px';c.classList.remove('conflict')});
  st.style.height=(CARDH+n*STEP+(ins<n?GAPX:0))+'px';
  var ph=st.querySelector('.stack-ph');if(!ph){ph=document.createElement('div');ph.className='stack-ph';st.appendChild(ph)}
  ph.style.top=(ins*STEP)+'px';

}

   unlock:'<rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
   beep:'<path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
   pin:'<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="11" r="2" fill="currentColor"/>',
   seatc:'<path d="M4 13c0-2.5 2.5-4 5.5-4H18l2 4H4z" fill="currentColor"/><path d="M7 16v3M17 16v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
   seato:'<path d="M5 10l3-5h8l2 6H5z" fill="currentColor"/><path d="M6 14h13M8 14v5M17 14v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
  }[n];
  return '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">'+p+'</svg>';
}
function cmdContent(c){
  var st=P.cmdS,off=kon(c,'offline')&&!st.conn,dis=off?' disabled':'',h='<div class="cm-hero"><svg viewBox="0 0 320 190" role="img" aria-label="Bike illustration" xmlns="http://www.w3.org/2000/svg"><ellipse cx="164" cy="176" rx="132" ry="8" fill="#14173A" opacity=".1"/><g fill="none"><circle cx="80" cy="135" r="34" stroke="#2B2F4A" stroke-width="10"/><circle cx="80" cy="135" r="20" fill="#fff" stroke="#DADDF2" stroke-width="3"/><circle cx="80" cy="135" r="6" fill="#8F96C8"/><circle cx="250" cy="135" r="34" stroke="#2B2F4A" stroke-width="10"/><circle cx="250" cy="135" r="20" fill="#fff" stroke="#DADDF2" stroke-width="3"/><circle cx="250" cy="135" r="6" fill="#8F96C8"/></g><path d="M52 118c2-30 36-46 74-44l50 4 6 36z" fill="#5A2DC0"/><path d="M62 108c6-20 30-30 58-30l44 3" fill="none" stroke="#8B63E8" stroke-width="5" stroke-linecap="round" opacity=".8"/><rect x="84" y="60" width="82" height="16" rx="8" fill="#1F2238"/><rect x="116" y="92" width="64" height="32" rx="9" fill="#7C4DE0"/><rect x="124" y="100" width="30" height="5" rx="2.5" fill="#fff" opacity=".7"/><circle cx="168" cy="108" r="4" fill="#5CE1FF"/><path d="M126 122h92l8 12H122z" fill="#3A3F66"/><path d="M206 120L226 54" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M212 49l34 5" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round"/><circle cx="246" cy="54" r="5.5" fill="#3A3F66"/><path d="M226 54l22 81" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round"/><circle cx="240" cy="70" r="7" fill="#FFD35A"/><circle cx="240" cy="70" r="3" fill="#fff"/><path d="M226 100q24-10 46 8" fill="none" stroke="#5A2DC0" stroke-width="6" stroke-linecap="round"/></svg></div>';
  if(kon(c,'vitals'))h+='<div class="cm-vit"><div class="cm-vrow"><span>'+cmI('bat')+'<small>75%</small></span><span>'+cmI('wifi')+'<small>4.3 V</small></span><button type="button" class="cm-conn" data-pa="cmdconn" aria-label="Connection, tap to simulate offline">'+cmI('bt')+'<small>'+(st.conn?'Connected':'Offline')+'</small></button><button type="button" class="cm-more" data-pa="cmdvit" aria-label="More vitals">'+(st.vit?'▾':'▸')+'</button></div>'+(st.vit?'<div class="cm-vrow cm-v2"><span><b>0</b><small>km/h</small></span><span><b>7,245</b><small>km</small></span><span><b>48</b><small>km range</small></span></div>':'')+'</div>';
  if(off)h+='<div class="pm-note" style="margin-top:10px">The bike is offline. Commands are paused until it reconnects.</div>';
  var t=function(k,label,state,on,ico){return '<button type="button" class="cm-t" data-pa="cmdtap" data-k="'+k+'"'+dis+'><span class="cm-c'+(on?' on':'')+'">'+ico+'</span><b>'+label+'</b><small>'+state+'</small></button>'};
  var g='';
  if(kon(c,'power'))g+=t('power','Power',st.power?'On':'Off',st.power,cmI('power'));
  if(kon(c,'wheel'))g+=t('wheel','Wheel',st.wheel?'Locked':'Unlocked',st.wheel,cmI(st.wheel?'lock':'unlock'));
  if(kon(c,'beep'))g+=t('beep','Beep',st.beep?'Beeping':'—',st.beep,cmI('beep'));
  if(kon(c,'locate'))g+=t('locate','Locate',st.loc?BIKE.hub:'—',st.loc,cmI('pin'));
  if(kon(c,'seat'))g+='<div class="cm-t span2" style="flex-direction:row;justify-content:space-between"><span style="text-align:left"><b style="display:block">Seat</b><small>'+st.seat+'</small></span><span style="display:flex;gap:10px"><button type="button" class="cm-c'+(st.seat==='Open'?' on':'')+'" data-pa="cmdseat" data-v="open" aria-label="Open seat"'+dis+'>'+cmI('seato')+'</button><button type="button" class="cm-c'+(st.seat==='Closed'?' on':'')+'" data-pa="cmdseat" data-v="close" aria-label="Close seat"'+dis+'>'+cmI('seatc')+'</button></span></div>';
  if(kon(c,'more'))g+='<button type="button" class="cm-t" data-pa="cmdall"><b style="margin-top:8px">›</b><small style="color:#222">View all</small></button>';
  return h+(g?'<div class="cm-grid">'+g+'</div>':'<p style="color:#888;margin-top:12px">No commands are switched on.</p>');

function cmSheet(c){
  var sh=P.cmdS.sheet;if(!sh)return '';
  if(sh.t==='confirm'){var st=P.cmdS,msg=sh.k==='power'?'Turn power '+(st.power?'off':'on')+'?':(st.wheel?'Unlock':'Lock')+' the wheel?';
    return '<div class="ck-sheet"><b>'+msg+'</b><small style="color:#777">This is sent to '+BIKE.no+'.</small><button type="button" class="pm-btn p" data-pa="cmdconfirm">Confirm</button><button type="button" class="pm-btn" data-pa="cmdsheetx">Cancel</button></div>'}
  var st2=P.cmdS,off=kon(c,'offline')&&!st2.conn;
  return '<div class="ck-sheet"><b>All commands</b>'+[['head','Headlight',st2.head],['ind','Indicators',st2.ind],['alarm','Alarm',st2.alarm]].map(function(x){return '<div class="pm-row"><span class="grow"><b>'+x[1]+'</b><br><small>'+(x[2]?'On':'Off')+'</small></span><button type="button" class="pm-btn'+(x[2]?' p':'')+'" data-pa="cmdtap" data-k="'+x[0]+'"'+(off?' disabled':'')+'>'+(x[2]?'Turn off':'Turn on')+'</button></div>'}).join('')+'<button type="button" class="pm-btn" data-pa="cmdsheetx">Close</button></div>';
}

/* boot */
restoreView();
(function(){var h=(location.hash||'').replace('#','');if(/^(library|builder|yc)$/.test(h)&&!hasView())S.tab=h})();
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace('#','');if(/^(library|builder|yc)$/.test(h)&&h!==S.tab){S.tab=h;S.sel=null;S.confirm=null;render()}});
render();
/* ───────── Ops app: runs the deck's phone as the installed app ─────────
   On open it fetches config.json (the flows and defaults published from the control deck) and then loads.
   Home card -> city, cluster, YC, profile -> Load. Nothing here edits flows; the deck does that. */
(function(){
var CFG_KEY='ops-cfg',SEL_KEY='ops-sel',cfgVer='',cfg=null,pendingReload=false;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function applyCfg(c){
  cfg=c;cfgVer=c.version||'';
  var r={};Object.keys(c.yc||{}).forEach(function(id){r[id]={workflow:c.yc[id]}});S.remote=r;
  Object.keys(c.defaults||{}).forEach(function(id){if(DEF0[id]){S.defs[id]=c.defaults[id];applyDef(id,c.defaults[id])}});
}
function profilesAt(yc){var wf=ycSaved(yc),out=[];PROFILES.forEach(function(p){if(wf.groups.some(function(g){return (g.chips||[]).indexOf(p.id)>=0}))out.push(p)});return out}
function ycName(id){var y=YCS.filter(function(x){return x.id===id})[0];return y?y.name:id}
function validSel(s){return s&&YCS.some(function(y){return y.id===s.yc})&&profilesAt(s.yc).some(function(p){return p.id===s.pid})}
function load(sel){
  lsSet(SEL_KEY,sel);S.ycSel=sel.yc;S.ycWork=null;window.OPS_SEL=sel;
  playProfile(sel.pid,null,'yc');
}
function start(){
  var s=lsGet(SEL_KEY);
  if(!validSel(s)){var yc=YCS[0].id,ps=profilesAt(yc);s={yc:yc,pid:(ps.filter(function(p){return p.id==='si'})[0]||ps[0]).id}}
  load(s);
}
function fetchCfg(first){
  return fetch('config.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(c){lsSet(CFG_KEY,c);return c})
    .catch(function(){var c=lsGet(CFG_KEY);if(c)return c;throw 0});
}
/* the home card becomes the picker */
var _pr=phoneRender;
phoneRender=function(){
  if(!P){if(cfg)start();return}
  _pr();
  var h=document.querySelector('#phone .hm-shift');
  if(h&&window.OPS_SEL&&!h.dataset.ops){h.dataset.ops='1';h.setAttribute('role','button');h.setAttribute('tabindex','0');h.style.cursor='pointer';
    h.innerHTML=h.innerHTML.replace('On Duty','On Duty')+'<span class="ops-where">'+esc(ycName(OPS_SEL.yc))+'</span><span class="ops-chev">›</span>'}
};
function esc2(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function openPicker(){
  var cur=window.OPS_SEL||{yc:YCS[0].id,pid:'si'},inf=ycInfo(cur.yc)||{city:CITIES[0],cluster:CITIES[0].clusters[0]};
  var st={city:inf.city.id,cluster:inf.cluster.id,yc:cur.yc,pid:cur.pid};
  var d=document.createElement('div');d.id='opspick';document.body.appendChild(d);
  function cityO(){return CITIES.filter(function(c){return c.id===st.city})[0]}
  function clusO(){return cityO().clusters.filter(function(k){return k.id===st.cluster})[0]||cityO().clusters[0]}
  function paint(){
    var ct=cityO(),cl=clusO();if(cl.id!==st.cluster)st.cluster=cl.id;if(cl.ycs.indexOf(st.yc)<0)st.yc=cl.ycs[0];
    var ps=profilesAt(st.yc);if(!ps.some(function(p){return p.id===st.pid}))st.pid=ps.length?ps[0].id:'';
    var sel=function(id,label,items,val){return '<label>'+label+'<select data-k="'+id+'">'+items.map(function(i){return '<option value="'+esc2(i[0])+'"'+(i[0]===val?' selected':'')+'>'+esc2(i[1])+'</option>'}).join('')+'</select></label>'};
    d.innerHTML='<div class="ops-bd"></div><div class="ops-sh" role="dialog" aria-label="Choose profile"><span class="ops-grab"></span><b>Switch profile</b><small>See the app as this person sees it at this YC.</small>'+
      sel('city','City',CITIES.map(function(c){return [c.id,c.name]}),st.city)+sel('cluster','Cluster',ct.clusters.map(function(k){return [k.id,k.name]}),st.cluster)+
      sel('yc','YC',cl.ycs.map(function(y){return [y,ycName(y)]}),st.yc)+sel('pid','Profile',ps.map(function(p){return [p.id,p.n]}),st.pid)+
      '<button type="button" class="ops-go"'+(st.pid?'':' disabled')+'>Load</button></div>';
  }
  d.addEventListener('change',function(e){var k=e.target.getAttribute('data-k');if(!k)return;st[k]=e.target.value;if(k==='city')st.cluster=cityO().clusters[0].id;paint()});
  d.addEventListener('click',function(e){if(e.target.classList.contains('ops-bd')){d.remove();return}
    if(e.target.classList.contains('ops-go')&&st.pid){d.remove();load({yc:st.yc,pid:st.pid})}});
  paint();
}
document.addEventListener('click',function(e){var h=e.target.closest&&e.target.closest('#phone .hm-shift');if(h&&!document.getElementById('opspick')){e.stopPropagation();openPicker()}},true);
/* latest flows: check on open, when the app returns to the foreground, and every minute */
function check(){
  fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(v){v=v.trim();if(!v||v===cfgVer)return;
    fetchCfg().then(function(c){applyCfg(c);if(P&&P.scr==='home'&&!document.getElementById('opspick'))load(window.OPS_SEL);else pendingReload=true})}).catch(function(){});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
setInterval(function(){if(!document.hidden)check()},60000);
/* back to home picks up anything published while a task was open */
setInterval(function(){if(pendingReload&&P&&P.scr==='home'&&!document.getElementById('opspick')){pendingReload=false;load(window.OPS_SEL)}},1500);
fetchCfg(true).then(function(c){applyCfg(c);start()}).catch(function(){document.getElementById('phone').innerHTML='<div class="ops-err"><b>Can’t load the flows</b><p>Check your connection and open the app again.</p></div>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();

})();
</script>
